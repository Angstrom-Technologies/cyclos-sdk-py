[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cyclos-sdk-py"
dynamic = ["version"]
description = "Production-grade Python SDK for the Cyclos 4.16 REST API"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    { name = "Angstrom Technologies", email = "dev@angstrom-technologies.ug" },
]
keywords = ["cyclos", "wallet", "fintech", "payments", "sdk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.27,<1.0",
    "pydantic>=2.5,<3.0",
    "pydantic-settings>=2.1,<3.0",
    "tenacity>=8.2,<9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "respx>=0.21,<1.0",
    "mypy>=1.7,<2.0",
    "ruff>=0.6.0",
]

[project.scripts]
cyclos = "angstrom_cyclos.__main__:main"

[project.urls]
Homepage = "https://github.com/Angstrom-Technologies/cyclos-sdk-py"
Repository = "https://github.com/Angstrom-Technologies/cyclos-sdk-py"
Issues = "https://github.com/Angstrom-Technologies/cyclos-sdk-py/issues"

[tool.hatch.version]
path = "src/angstrom_cyclos/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/angstrom_cyclos"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "N", "D", "UP", "B", "C4", "SIM", "TCH",
]
ignore = [
    "D100", "D101", "D102", "D103", "D104", "D105", "D107",
    "D203", "D212", "D213",
    "TC001", "TC003",
    "UP037",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
show_error_codes = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tenacity.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: marks tests that require a live Cyclos instance",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
